server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para máxima velocidad (Google PageSpeed 95+)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeceras de seguridad web
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caché inmutable de 1 año para assets estáticos generados por Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Caché para robots.txt, sitemap y favicon
    location ~* \.(ico|svg|txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Manejo de rutas limpias (clean URLs de Astro)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;
}
