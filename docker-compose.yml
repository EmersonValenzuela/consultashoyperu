services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://consultasperu.safezoneperu.com}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api-consultas.safezoneperu.com/api/v1}
    container_name: consultahoy_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
